<!DOCTYPE html>
<html>

<head>
    <title>Add Product – Inventory</title>
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:wght@400;500&display=swap"
        rel="stylesheet">
    <style>
        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'DM Sans', sans-serif;
            min-height: 100vh;
            background: linear-gradient(135deg, #0f0c29, #1b2838, #0d2137);
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow-x: hidden;
        }

        /* floating accents */
        body::before {
            content: '';
            position: fixed;
            width: 600px;
            height: 600px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(107, 203, 119, 0.18), transparent 70%);
            top: -200px;
            right: -200px;
            pointer-events: none;
        }

        body::after {
            content: '';
            position: fixed;
            width: 500px;
            height: 500px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(255, 217, 61, 0.12), transparent 70%);
            bottom: -200px;
            left: -100px;
            pointer-events: none;
        }

        header {
            width: 100%;
            padding: 20px 40px;
            display: flex;
            align-items: center;
            gap: 20px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            background: rgba(13, 27, 42, 0.6);
            backdrop-filter: blur(12px);
        }

        .nav-logo {
            font-family: 'Syne', sans-serif;
            font-size: 1rem;
            font-weight: 800;
            letter-spacing: 3px;
            background: linear-gradient(90deg, #ff6b6b, #ffd93d, #6bcb77, #4d96ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-decoration: none;
        }

        .back-link {
            color: rgba(255, 255, 255, 0.45);
            font-size: 0.85rem;
            text-decoration: none;
            padding: 6px 12px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 7px;
            margin-left: auto;
            transition: background 0.2s, color 0.2s;
        }

        .back-link:hover {
            background: rgba(255, 255, 255, 0.06);
            color: #fff;
        }

        .form-card {
            width: 100%;
            max-width: 520px;
            margin: 60px auto 40px;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(18px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            padding: 44px 44px 48px;
            box-shadow: 0 32px 80px rgba(0, 0, 0, 0.4);
            animation: slideUp 0.55s cubic-bezier(.16, 1, .3, 1) both;
            position: relative;
            z-index: 1;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(40px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .card-eyebrow {
            font-size: 0.72rem;
            font-weight: 500;
            letter-spacing: 2.5px;
            text-transform: uppercase;
            color: #6bcb77;
            margin-bottom: 8px;
        }

        h1 {
            font-family: 'Syne', sans-serif;
            font-size: 2rem;
            font-weight: 800;
            color: #fff;
            margin-bottom: 32px;
            line-height: 1.1;
        }

        /* Django form.as_p renders <p> with <label> + <input> */
        p {
            margin-bottom: 22px;
        }

        p label {
            display: block;
            font-size: 0.75rem;
            font-weight: 500;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            color: rgba(255, 255, 255, 0.5);
            margin-bottom: 8px;
        }

        p input,
        p textarea,
        p select {
            width: 100%;
            padding: 13px 16px;
            background: rgba(255, 255, 255, 0.07);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 11px;
            color: #fff;
            font-family: 'DM Sans', sans-serif;
            font-size: 0.97rem;
            outline: none;
            transition: border-color 0.2s, background 0.2s, box-shadow 0.2s;
            -webkit-text-fill-color: #fff;
        }

        p input:focus,
        p textarea:focus,
        p select:focus {
            border-color: #6bcb77;
            background: rgba(107, 203, 119, 0.09);
            box-shadow: 0 0 0 3px rgba(107, 203, 119, 0.15);
        }

        .submit-btn {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, #6bcb77, #38f9d7);
            border: none;
            border-radius: 12px;
            color: #0d2137;
            font-family: 'Syne', sans-serif;
            font-size: 1rem;
            font-weight: 800;
            letter-spacing: 1px;
            cursor: pointer;
            box-shadow: 0 8px 28px rgba(107, 203, 119, 0.35);
            transition: transform 0.15s, box-shadow 0.15s;
            margin-top: 8px;
        }

        .submit-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 14px 36px rgba(107, 203, 119, 0.5);
        }

        .submit-btn:active {
            transform: translateY(0);
        }
    </style>
</head>

<body>

    <header>
        <a class="nav-logo" href="/">📦 Invntry</a>
        <a class="back-link" href="/">← Back to List</a>
    </header>

    <div class="form-card">
        <div class="card-eyebrow">✦ New Entry</div>
        <h1>Add<br>Product</h1>
        <form method="POST">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit" class="submit-btn">Add Product ✓</button>
        </form>
    </div>

</body>

</html>
